schema: spec-driven

context: |
  Tech stack: Spring Boot 3.5.16 + Java 21 (Maven) backend / Angular 22 (NgModule, feature modules, NO standalone) + Angular Material + Bootstrap 5 frontend
  Architecture: Layered (controller → service → repository → entity) + DTOs + JWT auth + @EnableMethodSecurity/@PreAuthorize + ProblemDetail handler + AuditService (tabla auditoria)
  Testing: Backend unit (JUnit5+Mockito) + integration (H2 via application-test.properties); run via Docker Maven. Frontend vitest+jsdom via @angular/build:unit-test. strict_tdd: true
  Conventions: Feature modules (NgModules), Reactive Forms, Lombok entities, DTOs with manual getters/setters, PostgreSQL prod / H2 tests, Spanish-neutral messages
  Stack specialists: especialista_springboot (backend), especialista_angular (frontend)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages (backend layer, frontend module, Docker/infra)
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load stack specialists (especialista_springboot for backend, especialista_angular for frontend)
  verify:
    - Run tests: backend via Docker Maven (`mvn test`), frontend via `npm test`
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
