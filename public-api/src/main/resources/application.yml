spring:
  application:
    name: ferreplus-public-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://ferreplus:change-me-local@localhost:27017/ferreplus_public?authSource=admin}
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${SERVER_PORT:8080}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:ferreplus}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-local}
    cv-bucket: ${MINIO_CV_BUCKET:cv-bucket}
    media-bucket: ${MINIO_MEDIA_BUCKET:media-bucket}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://public.localhost,http://admin.localhost}
  mail:
    from: ${SMTP_FROM:no-reply@ferreplus.local}
logging:
  pattern:
    level: '%5p [corr:%X{correlationId:-}]'
  level:
    com.ferreplus.publico: INFO
---
spring:
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      uri: mongodb://localhost:27017/ferreplus_public_test
    redis:
      url: redis://localhost:6379
