http:
  middlewares:
    compress:
      compress: {}
    cors-public:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Idempotency-Key
          - X-Correlation-ID
        accessControlAllowOriginList:
          - http://public.localhost
          - http://public.localhost:8088
        accessControlMaxAge: 600
        addVaryHeader: true
