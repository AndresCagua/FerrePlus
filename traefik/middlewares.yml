http:
  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), geolocation=(), microphone=()"
        # HSTS se aplica en el terminador TLS de produccion, no en HTTP localhost.
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
