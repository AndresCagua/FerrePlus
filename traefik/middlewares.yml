http:
  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), geolocation=(), microphone=()"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
