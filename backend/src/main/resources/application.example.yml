server:
  port: 8080

chat:
  analytics:
    enabled: true

spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:postgresql://localhost:5432/ferreplus
    username: postgres
    password: YOUR_DB_PASSWORD
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  scalar:
    path: /scalar

app:
  jwt:
    secret: "YOUR_JWT_SECRET_CHANGE_ME"
    expiration: 86400000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:10}
  max-retries: ${GEMINI_MAX_RETRIES:1}

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ferreplus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:YOUR_DB_PASSWORD}
