pid /tmp/nginx/nginx.pid;
events {}
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    proxy_cache_path /tmp/nginx/cache levels=1:2 keys_zone=admin_cache:10m inactive=10m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # Keep API calls same-origin so HTTPS tunnels do not create mixed content.
    location ^~ /api/ {
        proxy_pass http://admin-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser and API are same-origin here. Do not make the internal
        # hop look like an external CORS request to Spring Security.
        proxy_set_header Origin "";
        proxy_set_header Access-Control-Request-Method "";
        proxy_set_header Access-Control-Request-Headers "";
        proxy_set_header Access-Control-Request-Private-Network "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # Only UUID image keys are reachable through this narrow public media path.
    location ^~ /media/ {
        proxy_pass http://public-api:8080/api/public/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
}
