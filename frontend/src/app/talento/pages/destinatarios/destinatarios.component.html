<section class="container-fluid"><h2>Destinatarios</h2><div *ngIf="error" class="alert alert-danger">{{ error }}</div><form [formGroup]="form" (ngSubmit)="save()" class="row g-2 mb-3"><mat-form-field class="col-md-4"><mat-label>Tipo</mat-label><mat-select formControlName="tipo"><mat-option value="JOB_APPLICATION">Postulaciones</mat-option><mat-option value="CONTACT_FORM">Contactos</mat-option></mat-select></mat-form-field><mat-form-field class="col-md-5"><mat-label>Email</mat-label><input matInput type="email" formControlName="email"></mat-form-field><div class="col-md-3"><button class="btn btn-primary mt-2" type="submit" [disabled]="form.invalid">Agregar</button></div></form><mat-spinner *ngIf="loading" diameter="40"></mat-spinner><div *ngIf="!loading && !destinatarios.length" class="alert alert-info">No hay destinatarios.</div><table *ngIf="!loading && destinatarios.length" mat-table [dataSource]="destinatarios" class="w-100"><ng-container matColumnDef="tipo"><th mat-header-cell *matHeaderCellDef>Tipo</th><td mat-cell *matCellDef="let d">{{ d.tipo }}</td></ng-container><ng-container matColumnDef="email"><th mat-header-cell *matHeaderCellDef>Email</th><td mat-cell *matCellDef="let d">{{ d.email }}</td></ng-container><ng-container matColumnDef="activo"><th mat-header-cell *matHeaderCellDef>Estado</th><td mat-cell *matCellDef="let d">{{ d.activo ? 'Activo' : 'Inactivo' }}</td></ng-container><ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef>Acciones</th><td mat-cell *matCellDef="let d"><button class="btn btn-link" (click)="toggle(d)">{{ d.activo ? 'Desactivar' : 'Activar' }}</button><button class="btn btn-link text-danger" (click)="remove(d.id)">Eliminar</button></td></ng-container><tr mat-header-row *matHeaderRowDef="['tipo','email','activo','acciones']"></tr><tr mat-row *matRowDef="let row; columns: ['tipo','email','activo','acciones'];"></tr></table></section>
