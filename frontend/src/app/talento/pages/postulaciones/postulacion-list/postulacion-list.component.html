<section class="container-fluid"><h2>Postulaciones</h2><app-indisponibilidad-talento *ngIf="error.includes('temporalmente')" (retry)="load()"></app-indisponibilidad-talento><div *ngIf="error && !error.includes('temporalmente')" class="alert alert-danger">{{ error }} <button class="btn btn-link" (click)="load()">Reintentar</button></div><mat-spinner *ngIf="loading" diameter="40"></mat-spinner><div *ngIf="loaded && !loading && !postulaciones.length" class="alert alert-info">No hay postulaciones para esta convocatoria.</div><table *ngIf="loaded && !loading && postulaciones.length" mat-table [dataSource]="postulaciones" class="w-100"><ng-container matColumnDef="nombre"><th mat-header-cell *matHeaderCellDef>Postulante</th><td mat-cell *matCellDef="let p">{{ p.nombres }} {{ p.apellidos }}</td></ng-container><ng-container matColumnDef="email"><th mat-header-cell *matHeaderCellDef>Email</th><td mat-cell *matCellDef="let p">{{ p.email }}</td></ng-container><ng-container matColumnDef="estado"><th mat-header-cell *matHeaderCellDef>Estado</th><td mat-cell *matCellDef="let p">{{ p.estado }}</td></ng-container><ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef>Acciones</th><td mat-cell *matCellDef="let p"><a class="btn btn-link btn-sm" [routerLink]="[p.id]">Detalle</a><app-cv-download [postulacionId]="p.id" *appHasPermission="'TALENTO_POSTULACIONES_VER'"></app-cv-download></td></ng-container><tr mat-header-row *matHeaderRowDef="['nombre','email','estado','acciones']"></tr><tr mat-row *matRowDef="let row; columns: ['nombre','email','estado','acciones'];"></tr></table></section>
