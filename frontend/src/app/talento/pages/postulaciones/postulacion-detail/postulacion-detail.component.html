<section class="container-fluid"><h2>Detalle de postulacion</h2><app-indisponibilidad-talento *ngIf="error.includes('temporalmente')" (retry)="load()"></app-indisponibilidad-talento><div *ngIf="error && !error.includes('temporalmente')" class="alert alert-danger">{{ error }}</div><mat-spinner *ngIf="loading" diameter="40"></mat-spinner><article *ngIf="postulacion && !loading"><h3>{{ postulacion.nombres }} {{ postulacion.apellidos }}</h3><p>{{ postulacion.email }} | {{ postulacion.telefono }}</p><p>Estado actual: <strong>{{ postulacion.estado }}</strong></p><app-cv-download [postulacionId]="postulacion.id"></app-cv-download><div class="mt-3"><button *ngFor="let estado of estados" class="btn btn-outline-primary me-2" [disabled]="!validTransition(estado)" (click)="transition(estado)">{{ estado }}</button></div><h4 class="mt-4">Historial</h4><ul><li *ngFor="let item of postulacion.historial">{{ item.fecha | date:'short' }} - {{ item.anterior }} → {{ item.nuevo }} ({{ item.actor }})</li></ul></article></section>
