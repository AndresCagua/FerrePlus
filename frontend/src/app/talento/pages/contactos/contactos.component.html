<section class="container-fluid"><h2>Contactos</h2><app-indisponibilidad-talento *ngIf="error.includes('temporalmente')" (retry)="load()"></app-indisponibilidad-talento><div *ngIf="error && !error.includes('temporalmente')" class="alert alert-danger">{{ error }}</div><mat-spinner *ngIf="loading" diameter="40"></mat-spinner><div *ngIf="loaded && !loading && !contactos.length" class="alert alert-info">No hay contactos.</div><div *ngFor="let contacto of contactos" class="card mb-2"><div class="card-body"><h3 class="h5">{{ contacto.asunto }}</h3><p>{{ contacto.nombre }} · {{ contacto.email }}</p><p>{{ contacto.mensaje }}</p><span class="badge bg-secondary">{{ contacto.estado }}</span> <button class="btn btn-link" (click)="mark(contacto)">{{ contacto.estado === 'READ' ? 'Marcar no leido' : 'Marcar leido' }}</button></div></div></section>
