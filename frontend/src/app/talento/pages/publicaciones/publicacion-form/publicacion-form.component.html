<section class="container-fluid"><h2>{{ id ? 'Editar' : 'Nueva' }} publicacion</h2><div *ngIf="error" class="alert alert-danger">{{ error }}</div><form [formGroup]="form" (ngSubmit)="save()" novalidate><div class="row"><mat-form-field class="col-md-6"><mat-label>Titulo</mat-label><input matInput formControlName="titulo"><mat-error>Titulo obligatorio</mat-error></mat-form-field><mat-form-field class="col-md-6"><mat-label>Slug</mat-label><input matInput formControlName="slug"><mat-error>Usa minusculas, numeros y guiones</mat-error></mat-form-field><mat-form-field class="col-md-6"><mat-label>Resumen</mat-label><textarea matInput formControlName="resumen"></textarea></mat-form-field><mat-form-field class="col-md-6"><mat-label>Categoria</mat-label><input matInput formControlName="categoria"></mat-form-field><mat-form-field class="col-12"><mat-label>Descripcion</mat-label><textarea matInput rows="6" formControlName="descripcion"></textarea></mat-form-field><mat-form-field class="col-md-6"><mat-label>SEO title</mat-label><input matInput formControlName="seoTitle"></mat-form-field><mat-form-field class="col-md-6"><mat-label>SEO description</mat-label><input matInput formControlName="seoDescription"></mat-form-field></div><button class="btn btn-primary" type="submit" [disabled]="saving">Guardar borrador</button> <button class="btn btn-link" type="button" routerLink="/talento/publicaciones">Cancelar</button></form></section>
