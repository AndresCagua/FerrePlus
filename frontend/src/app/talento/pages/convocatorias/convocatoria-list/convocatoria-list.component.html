<section class="container-fluid"><div class="d-flex justify-content-between mb-3"><h2>Convocatorias</h2><button class="btn btn-primary" routerLink="nuevo" *appHasPermission="'TALENTO_CONVOCATORIAS_CREAR'">Nueva convocatoria</button></div><app-indisponibilidad-talento *ngIf="error.includes('temporalmente')" (retry)="load()"></app-indisponibilidad-talento><div *ngIf="error && !error.includes('temporalmente')" class="alert alert-danger">{{ error }} <button class="btn btn-link" (click)="load()">Reintentar</button></div><mat-spinner *ngIf="loading" diameter="40"></mat-spinner><div *ngIf="loaded && !loading && !error && !convocatorias.length" class="alert alert-info">No hay convocatorias registradas.</div><table *ngIf="loaded && !loading && convocatorias.length" mat-table [dataSource]="convocatorias" class="w-100"><ng-container matColumnDef="titulo"><th mat-header-cell *matHeaderCellDef>Titulo</th><td mat-cell *matCellDef="let c">{{ c.titulo }}</td></ng-container><ng-container matColumnDef="periodo"><th mat-header-cell *matHeaderCellDef>Periodo</th><td mat-cell *matCellDef="let c">{{ c.fechaApertura | date }} - {{ c.fechaCierre | date }}</td></ng-container><ng-container matColumnDef="estado"><th mat-header-cell *matHeaderCellDef>Estado</th><td mat-cell *matCellDef="let c">{{ c.estado }}</td></ng-container><ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef>Acciones</th><td mat-cell *matCellDef="let c"><button class="btn btn-sm btn-link" [routerLink]="[c.id, 'editar']" *appHasPermission="'TALENTO_CONVOCATORIAS_EDITAR'">Editar</button><button class="btn btn-sm btn-link" (click)="state(c.id, c.estado === 'PUBLISHED' ? 'CLOSED' : 'PUBLISHED')" *appHasPermission="'TALENTO_CONVOCATORIAS_EDITAR'">{{ c.estado === 'PUBLISHED' ? 'Cerrar' : 'Publicar' }}</button><a class="btn btn-sm btn-link" [routerLink]="['/talento/postulaciones']" [queryParams]="{ convocatoriaId: c.id }" *appHasPermission="'TALENTO_POSTULACIONES_VER'">Postulaciones</a></td></ng-container><tr mat-header-row *matHeaderRowDef="['titulo','periodo','estado','acciones']"></tr><tr mat-row *matRowDef="let row; columns: ['titulo','periodo','estado','acciones'];"></tr></table></section>
