<div class="fade-in">
  <div class="page-header">
    <h2>Roles</h2>
    <button
      mat-raised-button
      color="primary"
      *appHasPermission="'ROLES_EDITAR'"
      (click)="navigateToNew()">
      <mat-icon>add</mat-icon>
      Nuevo Rol
    </button>
  </div>

  <mat-card>
    <mat-card-header>
      <mat-form-field class="search-field" appearance="outline">
        <mat-label>Buscar roles</mat-label>
        <input matInput (keyup)="applyFilter($event)">
        <mat-icon matSuffix>search</mat-icon>
        <mat-hint>Por nombre o descripción</mat-hint>
      </mat-form-field>
    </mat-card-header>

    <mat-card-content>
      <div class="loading-overlay" *ngIf="loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div class="table-container" *ngIf="!loading">
        <table mat-table [dataSource]="dataSource" matSort class="w-100">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let r" class="fw-medium">{{ r.nombre }}</td>
          </ng-container>

          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let r">{{ r.descripcion || '—' }}</td>
          </ng-container>

          <ng-container matColumnDef="permisos">
            <th mat-header-cell *matHeaderCellDef>Permisos</th>
            <td mat-cell *matCellDef="let r">
              <div class="permiso-badges">
                <span class="permiso-badge" *ngFor="let p of r.permisos">{{ p }}</span>
                <span class="text-muted" *ngIf="r.permisos.length === 0">Sin permisos</span>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="text-end">Acciones</th>
            <td mat-cell *matCellDef="let r" class="text-end">
              <button
                mat-icon-button
                color="primary"
                matTooltip="Editar"
                *appHasPermission="'ROLES_EDITAR'"
                (click)="navigateToEdit(r.id)">
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                matTooltip="Eliminar"
                *appHasPermission="'ROLES_EDITAR'"
                (click)="deleteRol(r)">
                <mat-icon>close</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div class="empty-state" *ngIf="dataSource.filteredData.length === 0 && !loading">
          <mat-icon>admin_panel_settings</mat-icon>
          <p>No se encontraron roles</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
