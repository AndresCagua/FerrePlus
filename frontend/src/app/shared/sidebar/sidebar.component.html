<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="brand">
      <mat-icon class="brand-icon">hardware</mat-icon>
      <span class="brand-text" *ngIf="!collapsed">FerrePlus</span>
    </div>
    <button class="collapse-btn" (click)="onToggle()" mat-icon-button>
      <mat-icon>{{ collapsed ? 'menu' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of visibleMenuItems; trackBy: trackByRoute">
      @if (item.module) {
      <button
        type="button"
        class="nav-item module-toggle"
        [class.active-module]="isModuleActive(item)"
        [attr.aria-expanded]="isExpanded(item)"
        [attr.aria-controls]="groupContentId(item)"
        [attr.aria-label]="'Expandir o contraer ' + item.label"
        (click)="toggleModule(item)"
        (keydown)="onModuleKeydown($event, item)">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
        <mat-icon class="module-chevron" *ngIf="!collapsed">{{ isExpanded(item) ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
      <div
        class="nav-submenu"
        [id]="groupContentId(item)"
        [attr.hidden]="!isExpanded(item) ? '' : null"
        *ngIf="isExpanded(item)">
        <a
          *ngFor="let child of item.children; trackBy: trackByRoute"
          [routerLink]="child.route"
          routerLinkActive="active"
          class="nav-item nav-subitem">
          <mat-icon class="nav-icon">{{ child.icon }}</mat-icon>
          <span class="nav-label">{{ child.label }}</span>
        </a>
      </div>
      } @else {
      <a
        [routerLink]="navigationRoute(item)"
        routerLinkActive="active"
        class="nav-item"
        [matTooltip]="collapsed ? item.label : ''"
        matTooltipPosition="right">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
         <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
       </a>
      }
    </ng-container>
  </nav>

  <div class="sidebar-footer" *ngIf="!collapsed">
    <div class="user-info">
      <mat-icon>account_circle</mat-icon>
      <div class="user-details">
        <span class="user-name">{{ authService.getCurrentUser()?.nombre || 'Usuario' }}</span>
        <span class="user-role">{{ authService.getCurrentUser()?.rol || '' }}</span>
      </div>
    </div>
  </div>
</aside>
